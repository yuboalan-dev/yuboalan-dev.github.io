<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游博安 Alan Yu</title>
<meta name="description" content="游博安（Alan Yu）：政大政治系學生，關注議事與治理、兩岸與中國政治、人本交通與地方提案。">
<meta property="og:title" content="游博安 Alan Yu">
<meta property="og:type" content="profile">
<meta property="og:description" content="政大學生議會議長。關注議事與治理、兩岸與中國政治、人本交通與地方提案。">
<meta property="og:url" content="https://yuboalan-dev.github.io/">
<!-- 分享預覽圖：社群平台只吃完整網址。換圖就覆蓋 assets/og.jpg（1200×630） -->
<meta property="og:image" content="https://yuboalan-dev.github.io/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://yuboalan-dev.github.io/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23000024'/><text x='32' y='45' font-size='36' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='900'>游</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 這個檔案平常不用改。文字請改 content.js -->

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#top" id="brand"></a>
    <nav class="topnav">
      <a class="navlink" href="#experience" data-zh="經歷" data-en="Experience"></a>
      <a class="navlink" href="#focus" data-zh="關注領域" data-en="Focus"></a>
      <a class="navlink" href="#works" data-zh="代表作" data-en="Work"></a>
      <a class="navlink" href="#media" data-zh="媒體" data-en="Media"></a>
      <button class="lang-btn" id="langBtn" type="button"></button>
      <a class="btn" id="cvBtn" href="cv.html" data-zh="正式 CV" data-en="CV"></a>
    </nav>
  </div>
</header>

<main id="top">

  <!-- 1. 首屏：桌牌（直排姓名）＋照片＋介紹 -->
  <section class="hero">
    <div class="wrap hero-grid">
      <div class="hero-visual">
        <div class="plate-wrap">
          <h1 class="nameplate" id="plate"></h1>
          <span class="plate-en" id="plateEn" aria-hidden="true"></span>
        </div>
        <div class="photo" id="photoWrap"></div>
      </div>
      <div class="intro">
        <p class="intro-name" id="introName"></p>
        <p class="tagline" id="tagline"></p>
        <p class="summary" id="summary"></p>
        <ul class="roles" id="roles"></ul>
        <div class="intro-actions">
          <div class="social" id="socialTop"></div>
          <a class="btn" id="cvBtn3" href="cv.html" data-zh="下載正式 CV" data-en="Download CV"></a>
        </div>
      </div>
    </div>
  </section>

  <!-- 2. 經歷（content.js 的 groups；標 collapsed: true 的組只先顯示前 3 筆） -->
  <section class="block" id="experience">
    <div class="wrap block-grid">
      <h2 class="block-title" data-zh="經歷" data-en="Experience"></h2>
      <div class="exp-grid" id="expBody"></div>
    </div>
  </section>

  <!-- 3. 近況（content.js 的 news，新到舊，先顯示 5 筆） -->
  <section class="block" id="news">
    <div class="wrap block-grid">
      <h2 class="block-title" data-zh="近況" data-en="Latest"></h2>
      <div><ul class="news" id="newsBody"></ul></div>
    </div>
  </section>

  <!-- 4. 關注領域 -->
  <section class="block washed" id="focus">
    <div class="wrap block-grid">
      <h2 class="block-title" id="focusHeading"></h2>
      <div class="focus" id="focusBody"></div>
    </div>
  </section>

  <!-- 5. 代表作 -->
  <section class="block" id="works">
    <div class="wrap block-grid">
      <h2 class="block-title" data-zh="代表作" data-en="Selected Work"></h2>
      <div class="works" id="worksBody"></div>
    </div>
  </section>

  <!-- 6. 媒體 -->
  <section class="block washed" id="media">
    <div class="wrap block-grid">
      <h2 class="block-title" data-zh="媒體與評論" data-en="Media"></h2>
      <div>
        <div class="media-feat" id="mediaFeat"></div>
        <div class="media-groups" id="mediaGroups"></div>
      </div>
    </div>
  </section>

</main>

<footer class="contact" id="contact">
  <div class="wrap">
    <div class="contact-grid">
      <h2 class="block-title" data-zh="聯絡" data-en="Contact"></h2>
      <div>
        <a class="contact-mail" id="contactMail" href="#"></a>
        <div class="social" id="socialBottom"></div>
        <a class="btn" id="cvBtn2" href="cv.html" data-zh="下載正式 CV" data-en="Download CV"></a>
      </div>
    </div>
    <p class="footnote" id="updated"></p>
  </div>
</footer>

<noscript>
  <p style="padding:24px">游博安（Alan Yu），國立政治大學政治學系，現任國立政治大學學生議會議長。這個網站需要開啟 JavaScript 才能顯示完整內容。</p>
</noscript>

<script src="content.js"></script>
<script src="common.js"></script>
<script>
(function () {
  var U = window.UTIL, S = U.S, L = U.getLang(), t = U.t, esc = U.esc;
  var other = L === "en" ? "zh" : "en";
  function $(id) { return document.getElementById(id); }
  function drop(id) { var el = $(id); if (el) el.remove(); }
  document.documentElement.lang = L === "en" ? "en" : "zh-Hant";

  /* 固定字樣與按鈕 */
  document.querySelectorAll("[data-zh]").forEach(function (el) { el.textContent = el.getAttribute("data-" + L); });
  $("langBtn").textContent = L === "en" ? "中文" : "EN";
  $("langBtn").onclick = function () { U.setLang(other); };
  ["cvBtn", "cvBtn2", "cvBtn3"].forEach(function (id) { $(id).href = "cv.html?lang=" + L; });

  /* 桌牌：一律直排中文姓名；英文名直排在旁。英文模式另在介紹欄放大英文名 */
  document.title = S.name.zh + " " + S.name.en;
  $("brand").innerHTML = esc(S.name.zh) + "<span>" + esc(S.name.en) + "</span>";
  $("plate").textContent = S.name.zh;
  $("plate").setAttribute("aria-label", S.name.zh + " " + S.name.en);
  $("plateEn").textContent = S.name.en;
  if (L === "en") $("introName").textContent = S.name.en; else drop("introName");

  var tl = t(S.tagline, L);
  if (tl) $("tagline").textContent = tl; else drop("tagline");
  $("summary").textContent = t(S.summary, L);

  /* 身分：content.js 的 roles。中文用全形空格分「單位　職稱」，英文用「職稱, 單位」 */
  $("roles").innerHTML = U.visible(S.roles, "web").map(function (r) {
    var s = t(r, L), org = s, role = "";
    if (L === "en") { var i = s.indexOf(", "); if (i > 0) { role = s.slice(0, i); org = s.slice(i + 2); } }
    else { var j = s.lastIndexOf("　"); if (j > 0) { org = s.slice(0, j).trim(); role = s.slice(j + 1).trim(); } }
    return '<li><span class="org">' + esc(org) + '</span><span class="role">' + esc(role) + "</span></li>";
  }).join("");

  /* 相片：找不到檔案就換成姓氏字樣 */
  var pw = $("photoWrap");
  function fallback() { pw.innerHTML = '<div class="photo-fallback">' + esc(S.name.zh.charAt(0)) + "</div>"; }
  if (S.photo) {
    var img = new Image();
    img.alt = S.name.zh; img.onerror = fallback; img.src = S.photo;
    pw.appendChild(img);
  } else fallback();

  /* 社群連結 */
  var socialHTML = U.activeLinks().map(function (l) {
    var ext = l.type === "email" ? "" : ' target="_blank" rel="noopener"';
    return '<a href="' + esc(U.href(l)) + '"' + ext + ' aria-label="' + esc(l.label) + '" title="' + esc(l.label) + '">' + U.icon(l.type) + "</a>";
  }).join("");
  ["socialTop", "socialBottom"].forEach(function (id) { if (socialHTML) $(id).innerHTML = socialHTML; else drop(id); });

  /* 經歷：每組一張卡，條目和說明直接顯示。
     組上標 collapsed: true 的，只先顯示前 3 筆，其餘按「顯示全部」展開 */
  var SHOW_FIRST = 3;
  (S.groups || []).forEach(function (g) {
    var items = U.visible(g.items, "web");
    if (!items.length || g.web === false || g.show === false) return;
    var box = document.createElement("div");
    box.className = "exp-group";
    box.innerHTML = '<h3 class="exp-title">' + esc(t(g.title, L)) + "</h3>" + items.map(function (it, i) {
      var p = U.period(it.period, L), role = t(it.role, L);
      var pts = (it.points || []).filter(function (x) { return x.show !== false && x.web !== false; })
        .map(function (x) { return "<li>" + esc(t(x, L)) + "</li>"; }).join("");
      var hide = g.collapsed && i >= SHOW_FIRST ? " is-more" : "";
      return '<div class="exp-item' + hide + '"><div class="exp-head"><div><div class="item-main">' + esc(t(it.org, L)) + "</div>" +
        (role ? '<div class="item-sub">' + esc(role) + "</div>" : "") + "</div>" +
        (p ? '<div class="exp-period">' + esc(p) + "</div>" : "") + "</div>" +
        (pts ? '<ul class="item-points">' + pts + "</ul>" : "") + "</div>";
    }).join("");
    if (g.collapsed && items.length > SHOW_FIRST) {
      var more = document.createElement("button");
      more.type = "button"; more.className = "more-btn";
      more.textContent = (L === "en" ? "Show all " : "顯示全部 ") + items.length + (L === "en" ? "" : " 筆");
      more.onclick = function () { box.classList.add("show-all"); more.remove(); };
      box.appendChild(more);
    }
    $("expBody").appendChild(box);
  });

  /* 近況：新到舊，先顯示 5 筆 */
  var news = U.visible(S.news, "web").slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
  if (news.length) {
    $("newsBody").innerHTML = news.map(function (n, i) {
      var txt = esc(t(n.text, L));
      if (n.url) txt = '<a href="' + esc(n.url) + '" target="_blank" rel="noopener">' + txt + "</a>";
      return '<li' + (i >= 5 ? ' class="is-more"' : "") + '><span class="d">' + esc(n.date || "") + "</span><span>" + txt + "</span></li>";
    }).join("");
    if (news.length > 5) {
      var nb = document.createElement("button");
      nb.type = "button"; nb.className = "more-btn";
      nb.textContent = L === "en" ? "Show all" : "顯示全部";
      nb.onclick = function () { $("newsBody").classList.add("show-all"); nb.remove(); };
      $("newsBody").parentNode.appendChild(nb);
    }
  } else drop("news");

  /* 關注領域 */
  var focus = U.visible(S.focus, "web");
  if (focus.length) {
    $("focusHeading").textContent = t(S.focusHeading, L);
    $("focusBody").innerHTML = focus.map(function (i) {
      return '<div class="focus-item"><h3>' + esc(t(i.title, L)) + "</h3><p>" + esc(t(i.text, L)) + "</p></div>";
    }).join("");
  } else drop("focus");

  /* 代表作 */
  var works = U.visible(S.works, "web");
  if (works.length) {
    $("worksBody").innerHTML = works.map(function (w) {
      var links = (w.links || []).filter(function (l) { return l.url; }).map(function (l) {
        return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(t(l.label, L)) + "</a>";
      }).join("");
      var steps = (w.steps || []).map(function (s) { return "<li>" + esc(t(s, L)) + "</li>"; }).join("");
      return '<article class="work"><div><h3>' + esc(t(w.title, L)) + '</h3><p class="desc">' + esc(t(w.text, L)) + "</p>" +
        (links ? '<div class="proof">' + links + "</div>" : "") + "</div>" +
        (steps ? '<ol class="steps">' + steps + "</ol>" : "") + "</article>";
    }).join("");
  } else drop("works");

  /* 媒體 */
  var media = U.visible(S.media, "web");
  function src(m) { return t(m.kind === "show" ? m.program : m.outlet, L); }
  function vurl(m) { return m.url || ("https://www.youtube.com/watch?v=" + m.id); }
  var feat = media.filter(function (m) { return m.featured; });
  if (feat.length) {
    $("mediaFeat").innerHTML = feat.map(function (m) {
      var thumb = m.id ? '<img loading="lazy" alt="" onerror="this.remove()" src="https://i.ytimg.com/vi/' + esc(m.id) + '/hqdefault.jpg">' : "";
      return '<a class="vid" href="' + esc(vurl(m)) + '" target="_blank" rel="noopener"><div class="thumb">' + thumb + "</div>" +
        '<div class="src">' + esc(src(m)) + '</div><div class="vt">' + esc(t(m.title, L)) + '</div><div class="vd">' + esc(m.date || "") + "</div></a>";
    }).join("");
  } else drop("mediaFeat");
  /* 下方清單：
     政論節目依 content.js 的 mediaList 決定——
       "summary"（預設）每個節目一行：節目名、集數、年份，不列每一集
       "full"            逐集列出
     新聞受訪一律逐則列出（則數少、內容中性）。 */
  var NEWS = L === "en" ? "News interviews" : "新聞受訪";
  var SHOWS = L === "en" ? "Political talk shows (guest commentator)" : "政論節目來賓";
  var full = S.mediaList === "full";
  var shows = {}, showOrder = [], news = [];
  media.forEach(function (m) {
    if (m.kind === "show") {
      var k = src(m);
      if (!shows[k]) { shows[k] = []; showOrder.push(k); }
      shows[k].push(m);
    } else if (!m.featured || full) news.push(m);   /* 精選已在上方出現的新聞，清單不重複列 */
  });
  function byDate(a, b) { return String(b.date).localeCompare(String(a.date)); }
  function row(m, label) {
    return '<li><a href="' + esc(vurl(m)) + '" target="_blank" rel="noopener"><span class="d">' + esc(m.date || "") +
      "</span><span>" + (label ? "<b>" + esc(label) + "</b>　" : "") + esc(t(m.title, L)) + "</span></a></li>";
  }
  var html = "";
  if (news.length) {
    html += '<div class="mgroup"><h3>' + esc(NEWS) + "<small>" + news.length + (L === "en" ? "" : " 則") + "</small></h3><ul>" +
      news.slice().sort(byDate).map(function (m) { return row(m, src(m)); }).join("") + "</ul></div>";
  }
  if (showOrder.length && !full) {
    var total = 0;
    var lines = showOrder.map(function (k) {
      var ys = shows[k].map(function (m) { return String(m.date || "").slice(0, 4); }).filter(Boolean).sort();
      var span = ys.length ? (ys[0] === ys[ys.length - 1] ? ys[0] : ys[0] + "–" + ys[ys.length - 1]) : "";
      total += shows[k].length;
      return '<li><span class="mline"><span class="d">' + esc(span) + "</span><span><b>" + esc(k) + "</b>　" +
        shows[k].length + (L === "en" ? " episodes" : " 集") + "</span></span></li>";
    }).join("");
    html += '<div class="mgroup"><h3>' + esc(SHOWS) + "<small>" + total + (L === "en" ? "" : " 集") + "</small></h3><ul>" + lines + "</ul></div>";
  }
  if (showOrder.length && full) {
    html += showOrder.map(function (k) {
      return '<div class="mgroup"><h3>' + esc(k) + "<small>" + shows[k].length + (L === "en" ? "" : " 集") + "</small></h3><ul>" +
        shows[k].slice().sort(byDate).map(function (m) { return row(m); }).join("") + "</ul></div>";
    }).join("");
  }
  if (html) $("mediaGroups").innerHTML = html;
  else if (!feat.length) drop("media");

  /* 結構化資料（schema.org Person）：Google 用來辨識「游博安」這個人，
     內容全部取自 content.js，不用另外維護 */
  try {
    var site = "https://yuboalan-dev.github.io/";
    var ld = {
      "@context": "https://schema.org", "@type": "Person",
      name: S.name.zh, alternateName: S.name.en, url: site,
      image: site + (S.photo || ""), description: t(S.summary, "zh"),
      jobTitle: t((U.visible(S.roles, "web")[0]) || "", "zh"),
      alumniOf: { "@type": "CollegeOrUniversity", name: "國立政治大學", alternateName: "National Chengchi University" },
      knowsAbout: U.visible(S.expertise, "web").map(function (e) { return e.zh; }),
      sameAs: U.activeLinks().filter(function (l) { return l.type !== "email"; }).map(function (l) { return l.url; })
    };
    var em = U.activeLinks().filter(function (l) { return l.type === "email"; })[0];
    if (em) ld.email = "mailto:" + em.url.replace(/^mailto:/, "");
    var sc = document.createElement("script");
    sc.type = "application/ld+json"; sc.textContent = JSON.stringify(ld);
    document.head.appendChild(sc);
  } catch (e) {}

  var mail = U.activeLinks().filter(function (l) { return l.type === "email"; })[0];
  if (mail) { $("contactMail").textContent = mail.url.replace(/^mailto:/, ""); $("contactMail").href = U.href(mail); }
  else drop("contactMail");
  $("updated").textContent = S.name.zh + " " + S.name.en + "　" + (L === "en" ? "Last updated " : "最後更新 ") + (S.updated || "");
})();
</script>
</body>
</html>
