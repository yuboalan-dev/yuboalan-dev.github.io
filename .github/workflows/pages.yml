# 建置網站（產生 CV PDF、預先產生網頁內容），依觸發方式決定要不要發布：
# - 推上 main（或手動執行）：建置並發布；CV 超過一頁照樣發布，但自動開 Issue 提醒，回到一頁就自動關掉
# - 對 main 開的 PR：只建置當檢查、不發布；頁面程式出錯或 CV 超過一頁，檢查就失敗，修好再合併
#   另外產生「前後對照」（tools/preview.mjs）：文字差異、CV 頁數、有變的畫面新舊並排，貼成 PR 留言；
#   截圖存在 previews 分支的 pr-編號/ 資料夾（不進 main、不發布），PR 關閉後自動刪掉
# 前提：repo 的 Settings → Pages → Source 要選「GitHub Actions」
name: 建置並發布網站

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

# 發布的那條線（main）新的推上來就取消舊的；每個 PR 各自一條，不會互相取消、也不會取消發布
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安裝中文字型（PDF 的備用字型）
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk
      - name: 安裝瀏覽器
        # 版本改這裡時，CLAUDE.md「改完怎麼驗收」和 tools/build.mjs 檔頭的本機指令要一起改
        run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: 建置
        id: build
        run: node tools/build.mjs

      - name: PR 裡 CV 超過一頁就讓檢查失敗
        if: github.event_name == 'pull_request' && steps.build.outputs.cv_overflow != ''
        run: |
          echo "::error file=content.js::CV 超過一頁（${{ steps.build.outputs.cv_overflow }}），請精簡後再合併"
          exit 1

      - name: CV 超過一頁就開 Issue，回到一頁就關掉
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          OVERFLOW: ${{ steps.build.outputs.cv_overflow }}
          TITLE: CV 超過一頁
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$OVERFLOW" ]; then
            body="預設 CV 應該剛好一頁 A4，這次建置變成：$OVERFLOW。網站已照樣發布，請精簡 content.js 的文字。建置紀錄：$RUN_URL"
            if [ -n "$open" ]; then gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"; fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "已回到一頁（$RUN_URL），自動關閉。"
          fi

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  # ---------- PR 的前後對照 ----------
  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 把截圖推到 previews 分支
      pull-requests: write   # 貼／更新 PR 留言
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: 取出改之後（PR）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
      - name: 取出改之前（main）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安裝中文字型與瀏覽器
        working-directory: head
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk
          npm install --no-save playwright@1.48.2 pngjs@7 && npx playwright install --with-deps chromium
      - name: 拍照比較
        run: node head/tools/preview.mjs base head out
      - name: 截圖推到 previews 分支
        run: |
          shopt -s nullglob
          files=(out/*.png)
          [ ${#files[@]} -eq 0 ] && exit 0
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone -q --depth 1 --branch previews "$url" pv 2>/dev/null || { git init -q -b previews pv && git -C pv remote add origin "$url"; }
          rm -rf "pv/pr-$PR" && mkdir -p "pv/pr-$PR/${SHA:0:7}" && cp "${files[@]}" "pv/pr-$PR/${SHA:0:7}/"
          cd pv
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "PR #$PR 前後對照截圖（${SHA:0:7}）"
          for i in 1 2 3; do git push -q origin previews && break; git pull -q --rebase origin previews; done
      - name: 貼／更新 PR 留言
        run: |
          img="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/previews/pr-$PR/${SHA:0:7}"
          { echo "<!-- preview -->"; sed "s#{{IMG}}#$img#g" out/comment.md; echo; echo "<sub>對照的版本：${SHA:0:7}（每次推新的 commit 會自動更新這則留言）</sub>"; } > body.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- preview -->")) | .id' | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@body.md >/dev/null
          else gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@body.md >/dev/null; fi

  preview-cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 刪掉這個 PR 的截圖
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone -q --depth 1 --branch previews "$url" pv 2>/dev/null || exit 0
          cd pv && [ -d "pr-$PR" ] || exit 0
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq "pr-$PR" && git commit -q -m "PR #$PR 已關閉，刪除前後對照截圖" && git push -q origin previews

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
