# 每次 main 有更新，就建置並發布網站（產生 CV PDF、預先產生網頁內容）
# 前提：repo 的 Settings → Pages → Source 要選「GitHub Actions」
name: 建置並發布網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安裝中文字型（PDF 的備用字型）
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk
      - name: 安裝瀏覽器
        run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: 建置
        run: node tools/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
